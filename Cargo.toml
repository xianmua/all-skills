[package]
name = "all-skills"
version = "0.1.0"
edition = "2021"
description = "CLI tool for managing skill packages from git repositories"
license = "MIT"
repository = "https://github.com/xianmua/all-skills.git"
authors = ["Your Company"]
readme = "README.md"

[[bin]]
name = "all-skills"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Configuration
toml = "0.8"

# Git operations
git2 = "0.19"

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# HTTP client for API calls
reqwest = { version = "0.12", features = ["json"] }

# Directory and path utilities
dirs = "5.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Formatting and display
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
colored = "2.1"

# URL parsing
url = "2.5"

# Terminal detection
atty = "0.2"

# Async trait support
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.10"
mockall = "0.12"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"